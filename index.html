<!DOCTYPE html>
<html>
<head>
  <title>PDF Share App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      width: 300px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    h2 { margin-bottom: 15px; }

    input, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
    }

    button:hover {
      background: #0056b3;
    }

    #otpBox, #downloadBox {
      display: none;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>📄 PDF Share</h2>

  <!-- Upload -->
  <input type="file" id="fileInput" accept="application/pdf">
  <button onclick="uploadFile()">Upload</button>

  <!-- OTP Show -->
  <div id="otpBox">
    <p>Your OTP:</p>
    <h3 id="otpText"></h3>
  </div>

  <!-- Verify -->
  <input type="text" id="otpInput" placeholder="Enter OTP">
  <button onclick="verifyOTP()">Verify</button>

  <!-- Download -->
  <div id="downloadBox">
    <button onclick="downloadFile()">Download PDF</button>
  </div>
</div>

<script>
let filename = "";

async function uploadFile() {
  const file = document.getElementById("fileInput").files[0];

  const formData = new FormData();
  formData.append("file", file);

  const res = await fetch("http://localhost:3000/upload", {
    method: "POST",
    body: formData
  });

  const data = await res.json();

  document.getElementById("otpText").innerText = data.otp;
  document.getElementById("otpBox").style.display = "block";
}

async function verifyOTP() {
  const otp = document.getElementById("otpInput").value;

  const res = await fetch("http://localhost:3000/verify", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ otp })
  });

  const data = await res.json();

  filename = data.filename;
  document.getElementById("downloadBox").style.display = "block";
}

function downloadFile() {
  window.location.href = "http://localhost:3000/download/" + filename;
}
</script>

</body>
</html>
